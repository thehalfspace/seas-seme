# SEAS-SEME Configuration: 2D Strike-Slip Earthquake Cycle Simulation
#
# This configuration reproduces the benchmark case with a 40km x 40km domain,
# vertical fault from 20-40km depth, and rate-state friction.

[constants]
yr2sec = 31557600.0                 # Seconds per year (365.25 * 24 * 3600)
day2sec = 86400.0                   # Seconds per day (24 * 3600)

[simulation]
name = "strike_slip_2d_test"
total_time_years = 110.0             # Total simulation time in years
output_dir = "./data"               # Base output directory (simulation folder created inside)

[mesh]
file = "./data/mesh/homogeneous/homogeneous.mesh"     # HOHQMesh mesh file
#file = "./data/mesh/amr/unstructured_amr.mesh"     # HOHQMesh mesh file
polynomial_degree = 4               # Spectral element polynomial degree (p=4)

[physics]
# Deformation formulation: "antiplane" (SH waves) or "plane_strain" (P-SV waves)
formulation = "antiplane"
dip_angle = 90.0                    # Fault dip angle in degrees (90 = vertical)
poisson_ratio = 0.25                # Poisson's ratio (used for plane_strain only)

# Material properties
density = 2670.0                    # Density (kg/m³)
shear_velocity = 3464.0             # Shear wave velocity (m/s)

# Plate loading and friction
plate_velocity = 1.11e-9            # 35 mm/yr in m/s (35e-3 / (365*24*60*60))
reference_friction = 0.6            # Reference friction coefficient fo
reference_slip_rate = 1.0e-6        # Reference slip rate Vo (m/s)

[physics.initial_conditions]
file = "./config/ic_strike_slip.csv"

[solvers]
cfl_number = 0.6                    # CFL stability criterion
dt_max_days = 100.0                 # Maximum timestep in days
dt_min_factor = 0.2                 # dt_min = factor * dx/vs

[solvers.quasistatic]
tolerance = 1.0e-6                  # Convergence tolerance for CG solver
max_iterations = 100                # Maximum CG iterations
amg_max_levels = 10                 # Maximum AMG multigrid levels

[solvers.dynamic]
velocity_threshold_qs_to_dyn = 5.0e-3   # Switch QS → dynamic when Vmax >= 5 mm/s
velocity_threshold_dyn_to_qs = 2.0e-3   # Switch dynamic → QS when Vmax < 2 mm/s

[output]
format = "hdf5"                     # Output format (only HDF5 supported)
log_interval = 500                  # Print status every N iterations

# Time series output depths (km along fault)
timeseries_depths = [0.0, 2.5, 5.0, 7.5, 10.0, 12.5, 15.0, 17.5, 20.0]

# Full-field snapshot interval
snapshot_interval_years = 1.0       # Snapshot every N years

[output.fields]
displacement = true                 # Output displacement field
velocity = true                     # Output velocity field
fault_slip = true                   # Output fault slip
fault_stress = true                 # Output fault shear stress
state_variable = true               # Output rate-state variable ψ

# Full fault snapshot configuration (for slip contour plots)
[output.snapshots]
enabled = true                      # Enable full fault snapshots
quasistatic_interval_years = 2.0    # Snapshot interval during interseismic (years)
dynamic_interval = 0.1              # Snapshot interval during earthquakes (seconds)
velocity_threshold = 1.0e-3         # Threshold to identify dynamic events (1 mm/s)

[checkpointing]
enabled = true                      # Enable checkpointing for restarts
interval_years = 100.0                # Checkpoint every N years
keep_last = 5                       # Keep only the last N checkpoints
