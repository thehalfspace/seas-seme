# Unstructured Mesh Configuration for Dipping Fault (60°)
#
# Generates a pentagonal domain with a 60° dipping fault on the right side.
# Same domain size and refinement as mesh_2d_homogeneous.toml.
#
# Usage:
#   julia scripts/generate_mesh.jl config/mesh_dipping_fault.toml

[domain]
# Domain dimensions (meters)
Lx = 40.0e3                    # Domain width (40 km)
Ly = 40.0e3                    # Domain height (40 km)

[fault]
# Fault geometry (meters)
start_y = 20.0e3               # Y-coordinate where fault begins (20 km)
                               # Fault extends from start_y to Ly on dipping right edge
dip_angle = 60.0               # Fault dip angle in degrees (60° dipping fault)

[meshing]
# Element sizing (meters)
background_grid_size = 2.0e3   # Default element size away from fault (2 km)
fault_refinement_h = 1e3       # Target element size along fault (1 km)
fault_refinement_width = 5.0e3 # Width of refinement zone around fault (5 km)

# Spectral element configuration
polynomial_order = 4           # Polynomial degree (p=4 means 5 nodes per element)

# Mesh quality
smoothing_iterations = 50      # Number of spring smoothing iterations

[boundaries]
# Boundary conditions defined in mesh
# - fault: Dipping right edge from (x_t, start_y) to (Lx, Ly)
# - creep: Dipping right edge from (x_b, 0) to (x_t, start_y)
# - absorbing: Bottom edge and left edge
# - free_surface: Top edge

[output]
# Mesh output configuration
output_dir = "data/mesh/dipping_fault_60"
mesh_name = "dipping_fault"
